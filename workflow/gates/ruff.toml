# ruff configuration for the py_lint gate stage (WO-0129). Pass it with --config; run it with workflow/gates/py_lint.sh.
# Rule sets: pyflakes (F), flake8-bugbear (B), flake8-bandit (S). Every finding is an error; py_lint.sh passes --ignore-noqa, so a
# `# noqa` comment switches nothing off. Findings that existed when the rules were added are listed per file below (the rule codes that
# fire in that file). py_lint.test.ts counts them per file with exact numbers: the list may only shrink (docs/LINT-RULES.md).
# Never add a line here by hand; a work order removes lines.
target-version = "py311"
line-length = 120
respect-gitignore = true

[lint]
select = ["F", "B", "S"]

